<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Payment received | BrightSum</title>
  <meta name="robots" content="noindex,nofollow,noarchive">
  <script src="google-measurement.js?v=20261001a" defer></script>
  <link rel="stylesheet" href="legal.css">
</head>
<body class="legal-page">
  <main class="legal-wrap">
    <nav class="legal-top"><a class="legal-brand" href="index.html"><span>+</span>BrightSum</a></nav>
    <h1>Thank you</h1>
    <p>Your checkout has been received. Keep the Stripe confirmation for your records.</p>
    <p><a href="index.html">Return to BrightSum</a></p>
  </main>
  <script>
    document.addEventListener('DOMContentLoaded', async function () {
      const sessionId = new URLSearchParams(location.search).get('session_id');
      if (!/^cs_[A-Za-z0-9_]+$/.test(sessionId || '')) return;
      const eventKey = `brightsum_ads_subscription_${sessionId}`;
      if (sessionStorage.getItem(eventKey)) return;
      try {
        const response = await fetch('https://europe-west2-brightsum-3d5aa.cloudfunctions.net/verifyCheckoutSession?session_id=' + encodeURIComponent(sessionId), {
          headers: {Accept: 'application/json'}, credentials: 'omit'
        });
        const result = await response.json();
        if (!response.ok || result.verified !== true || result.sessionId !== sessionId || !window.brightSumMeasurement) return;
        sessionStorage.setItem(eventKey, 'sent');
        window.brightSumMeasurement.event('subscription_success');
        window.brightSumMeasurement.event('conversion', {
          send_to: 'AW-18434743732/FKcvCPO-zYwdELS7r9ZE',
          transaction_id: sessionId,
          value: 1.0,
          currency: 'GBP'
        });
      } catch (_) {
        // A failed verification must never become a conversion.
      }
    });
  </script>
</body>
</html>
